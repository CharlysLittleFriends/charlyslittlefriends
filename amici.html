<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/googleIntegration.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Amici - Charly's Little Friends</title>
</head>
<body>
    <div id="header"></div>

    <main>
        <h1>Lista degli Amici</h1>
        <p>Dati caricati automaticamente da Google Sheets:</p>

        <!-- FILTRI -->
        <div class="filters" aria-label="Filtri">
            <label for="filter-type">Type</label>
            <select id="filter-type">
                <option value="">Tutti i Type</option>
            </select>

            <label for="filter-dim">Dimensions</label>
            <select id="filter-dim">
                <option value="">Tutte le Dimensions</option>
            </select>

            <label for="filter-colors">Colors</label>
            <select id="filter-colors">
                <option value="">Tutti i Colors</option>
            </select>
        </div>

        <!-- GRID CARDS -->
        <section id="cards-section" aria-label="Catalogo pupazzetti">
            <div id="cards-container" aria-live="polite"></div>
        </section>
    </main>

    <!-- FOOTER -->
    <div id="footer"></div>
    <script src="js/common.js"></script>

</body>
</html>
