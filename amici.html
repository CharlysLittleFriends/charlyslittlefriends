<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Read Google Sheets Data</title>
</head>
<body>
    <script>
        // URL del foglio di Google Sheets (assumendo l'ID della tabella sia 0)
        const googleSheetUrl = "https://docs.google.com/spreadsheets/d/1AbCDeFGhIJKL1234567890/gviz/tq?tqx=out:json";

        fetch(googleSheetUrl)
            .then(res => res.text())
            .then(text => {
                // Rimuovi la parte iniziale del JSON generato da Google Sheets
                const json = JSON.parse(text.substring(47, text.length - 2));
                console.log(json.table.rows);
            })
            .catch(error => console.error('Error fetching data:', error));
    </script>
</body>
</html>
