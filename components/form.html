<div class="contact-form">
    <h2>Scrivimi</h2>

    <form id="contact-form" action="https://api.web3forms.com/submit" method="POST">

        <input type="hidden" name="access_key" value="4eb5973e-d503-4db7-99be-55571dda5953">

        <div class="form-group">
            <label for="name">Nome *</label>
            <input type="text" id="name" name="name" required placeholder="Es. Maria Rossi">
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required placeholder="esempio@dominio.com">
        </div>

        <div class="form-group">
            <label for="message">Messaggio *</label>
            <textarea id="message" name="message" rows="6" required placeholder="Scrivi qui il tuo messaggio..."></textarea>
        </div>

        <div class="form-group toggle-group">
            <label class="toggle">
                <input type="checkbox" id="newsletter" name="newsletter" checked>
                <span class="slider"></span>
            </label>
            <span class="toggle-text">Voglio sapere informazioni mensili su offerte e ultime news</span>
        </div>

        <button type="submit">Invia</button>
        <button type="reset">Reset</button>

    </form>
</div>
